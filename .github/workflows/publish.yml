name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# The extracted JSON, the generated Typst and the cover art are all committed, so
# this job needs only the Typst compiler — no Python, and never the source PDFs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The covers live in Git LFS; the compile reads the real PNGs.
          lfs: true

      - uses: typst-community/setup-typst@v5

      - name: Compile everything on the render list
        run: |
          mkdir -p _site
          count=0
          # emit.py writes build/render.json from the books in src/, so a book
          # that is there is a book this loop compiles.
          for id in $(jq -r '.[].id' build/render.json); do
            echo "::group::$id"
            # Bundled fonts only, so the CI render matches the local one exactly.
            typst compile --ignore-system-fonts --root . \
              "src/$id.typ" "_site/$id.pdf"
            # The cover keeps the source image's own extension.
            cover=$(jq -r --arg i "$id" \
              '.[] | select(.id==$i) | .cover // empty' build/render.json)
            if [ -n "$cover" ] && [ -f "assets/$cover" ]; then
              cp "assets/$cover" "_site/$id-cover.${cover##*.}"
            fi
            count=$((count + 1))
            echo "::endgroup::"
          done
          cp site/index.html _site/index.html
          echo "compiled $count books"
          du -sh _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
